spring.application.name=ServeurTomcat
server.servlet.context-path=/
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:../serveurDeno/kanban.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.packages-to-scan=com.kanban
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
spring.mongodb.uri=${MONGO_URI}
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:true}
spring.main.banner-mode=off
