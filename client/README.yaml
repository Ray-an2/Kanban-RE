        '408':
          description: (TIMEOUT) délai d'attente dépassé.
        '500':
          description: (SERVER_ERROR) erreur interne du serveur.
    post:
      summary: Création d'une liste
      description: Route protégée pour créer une liste dans un tableau.
      security:
        - bearerAuth: []
      parameters:
        - name: tabId
          in: path
