        '404':
          description: (NOT_FOUND) ressources introuvables.
        '408':
          description: (TIMEOUT) délai d'attente dépassé.
        '500':
          description: (SERVER_ERROR) erreur interne du serveur.
  /tableau/{tabId}/liste/{lisId}:
    get:
      summary: Détails d'une liste
      description: Route protégée pour récupérer une liste.
      security:
        - bearerAuth: []
