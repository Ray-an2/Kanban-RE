          description: (ROLE_UNAUTHORIZED) rôle insuffisant.
        '404':
          description: (NOT_FOUND) ressource introuvable.
        '500':
          description: (SERVER_ERROR) erreur interne du serveur.
    delete:
      summary: Suppression d'une notification
      description: Supprime une notification.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Identifiant de la notification.
      responses:
        '204':
          description: Notification supprimée.
        '401':
          description: (UNAUTHORIZED) non autorisé.
        '403':
          description: (ROLE_UNAUTHORIZED) rôle insuffisant.
        '404':
          description: (NOT_FOUND) ressource introuvable.
        '500':
          description: (SERVER_ERROR) erreur interne du serveur.

