<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>client</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <h1>Kanban</h1>
    <div id="board">
  <div class="column" id="todo">
    <h2 class="column-title">To Do</h2>
    <div class="cards">
      <div class="card" onclick="toggleCardDetails(this)">
        <div class="card-title">Task 1</div>
        <div class="card-details">
          <p>Description : Terminer la maquette du projet.</p>
          <p>Date limite : 15/03/2026</p>
        </div>
      </div>
      <div class="card" onclick="toggleCardDetails(this)">
        <div class="card-title">Task 2</div>
        <div class="card-details">
          <p>Description : Préparer la réunion avec l'équipe.</p>
          <p>Date limite : 12/03/2026</p>
        </div>
      </div>
    </div>
  </div>
  <div class="column" id="in-progress">
    <h2 class="column-title">In Progress</h2>
    <div class="cards">
      <div class="card" onclick="toggleCardDetails(this)">
        <div class="card-title">Task 3</div>
        <div class="card-details">
          <p>Description : Développer la fonctionnalité de login.</p>
          <p>Date limite : 20/03/2026</p>
        </div>
      </div>
    </div>
  </div>
</div>

  </body>
  <script>
    function toggleCardDetails(cardElement) {
    cardElement.classList.toggle("card-expanded");
    }

  </script>
</html>
