<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>client</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <h1>Kanban</h1>
    <div id="board">
      <div class="column" id="todo">
        <h2 class="column-title">To Do</h2>
        <div class="cards"
            ondragover="dragOver(event)"
            ondragleave="dragLeave(event)"
            ondrop="drop(event)">
          <div class="card" draggable="true" ondragstart="dragStart(event)" ondragend="dragEnd(event)">
            <div class="card-title" onclick="openModal('Task 1', 'Terminer la maquette.', '15/03/2026')">Task 1</div>
          </div>
          <div class="card" draggable="true" ondragstart="dragStart(event)">
            <div class="card-title" onclick="openModal('Task 2', 'Préparer la réunion.', '12/03/2026')">Task 2</div>
          </div>
        </div>
      </div>
      <div class="column" id="in-progress">
        <h2 class="column-title">In Progress</h2>
        <div class="cards"
            ondragover="dragOver(event)"
            ondragleave="dragLeave(event)"
            ondrop="drop(event)">
          <div class="card" draggable="true" ondragstart="dragStart(event)">
            <div class="card-title" onclick="openModal('Task 3', 'Développer la fonctionnalité de login.', '20/03/2026')">Task 3</div>
          </div>
        </div>
      </div>
    </div>
    
    <div id="modal" class="modal">
      <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 id="modal-title">Titre de la tâche</h2>
        <p id="modal-description">Description...</p>
        <p id="modal-due-date">Date limite...</p>
      </div>
    </div>
<script>
    function toggleCardDetails(cardElement) {
      cardElement.classList.toggle("card-expanded");
    }

    function openModal(title, description, dueDate) {
      document.getElementById("modal-title").textContent = title;
      document.getElementById("modal-description").textContent = "Description : " + description;
      document.getElementById("modal-due-date").textContent = "Date limite : " + dueDate;
      document.getElementById("modal").style.display = "block";
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }


    window.onclick = function(event) {
      const modal = document.getElementById("modal");
      if (event.target === modal) {
        modal.style.display = "none";
      }
    };
    let draggedCard = null;
let placeholder = null;
let dragSourceColumn = null;

document.querySelectorAll(".cards").forEach(cardsContainer => {
  cardsContainer.addEventListener("dragover", function(e) {
    dragOver(e);
  });
  cardsContainer.addEventListener("dragleave", function(e) {
    dragLeave(e);
  });
  cardsContainer.addEventListener("drop", function(e) {
    drop(e);
  });
});

function dragStart(e) {
  if (placeholder) {
    placeholder.parentNode.removeChild(placeholder);
    placeholder = null;
  }

  draggedCard = e.target.closest(".card");
  dragSourceColumn = draggedCard.parentNode;
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", "");
  draggedCard.style.opacity = "0.5";

  placeholder = document.createElement("div");
  placeholder.className = "card placeholder";
  placeholder.style.height = `${draggedCard.offsetHeight}px`; // Même hauteur que la carte
  dragSourceColumn.insertBefore(placeholder, draggedCard.nextSibling);
  
  if (dragSourceColumn.children.length === 1) {
    dragSourceColumn.classList.add("empty");
  }

  e.stopPropagation();
}

function dragOver(e) {
  e.preventDefault();
  e.stopPropagation();
  e.dataTransfer.dropEffect = "move";

  const cardsContainer = e.target.closest(".cards");
  if (!cardsContainer) return;

  // Si la colonne est vide, ajoute un placeholder
  if (cardsContainer.children.length === 0 || cardsContainer.classList.contains("empty")) {
    if (!cardsContainer.querySelector(".placeholder")) {
      cardsContainer.appendChild(placeholder);
    }
    cardsContainer.classList.remove("empty");
    return;
  }

  // Trouve la carte sous le curseur
  const targetCard = e.target.closest(".card:not(.placeholder)");
  if (!targetCard || targetCard === placeholder) return;

  // Déplace le placeholder avant/après la carte cible
  const rect = targetCard.getBoundingClientRect();
  const nextSibling = (e.clientY - rect.top) < (rect.height / 2)
    ? targetCard
    : targetCard.nextSibling;

  cardsContainer.insertBefore(placeholder, nextSibling);
}

// Quand une carte quitte la zone de drop
function dragLeave(e) {
  e.stopPropagation();
}

// Quand une carte est déposée
function drop(e) {
  e.preventDefault();
  e.stopPropagation();

  const cardsContainer = e.target.closest(".cards");
  if (!cardsContainer || !placeholder || !draggedCard) return;

  // Insère la carte à la place du placeholder
  cardsContainer.insertBefore(draggedCard, placeholder);
  cardsContainer.removeChild(placeholder);

  // Réinitialise les styles et états
  draggedCard.style.opacity = "1";
  if (dragSourceColumn.children.length === 0) {
    dragSourceColumn.classList.add("empty");
  }

  // Réinitialise tout
  draggedCard = null;
  placeholder = null;
  dragSourceColumn = null;
}

// Quand le drag est terminé (même si pas de drop)
function dragEnd(e) {
  e.stopPropagation();

  if (draggedCard) {
    draggedCard.style.opacity = "1";
  }

  if (placeholder) {
    placeholder.parentNode.removeChild(placeholder);
    if (dragSourceColumn && dragSourceColumn.children.length === 0) {
      dragSourceColumn.classList.add("empty");
    }
  }

  // Réinitialise tout
  draggedCard = null;
  placeholder = null;
  dragSourceColumn = null;
}


  </script>
  </body>
</html>
